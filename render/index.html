  whose licence allows reuse/remix with a link back. Everything is a pure function of song time t:
  render.mjs calls window.renderAt(t) per frame. Draft 1 lives in index-v3-draft1.html.
  Draft 2 adds: a real beat map (the song drifts 136 -> 140 BPM), per-word timings, a pixel-art sprite for
  what is being sung (sprites.js), squash-and-stretch on every beat, impact frames, camera shake/zoom punches,
  particles, comic onomatopoeia, window choreography per section, and a hang-then-collapse at "same tool".

-->

<script>
// =====================================================================================
// 1. utilities
// =====================================================================================
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,k)=>a+(b-a)*k;
const easeOutCubic=x=>1-Math.pow(1-clamp(x,0,1),3);

      <circle cx="-760" cy="${f1(sunY)}" r="150" fill="#ffe7a0" opacity="${f3(dw)}"/><circle cx="-760" cy="${f1(sunY)}" r="230" fill="#ffd27a" opacity="${f3(dw*.25)}"/>
      <g fill="${mixc('#0b0918','#3b2a55',dw)}">${city}</g><g fill="#ffd66e">${lit}</g></g>
    <rect x="-1240" y="-440" width="900" height="1630" fill="none" stroke="#2b2440" stroke-width="44"/><rect x="-812" y="-420" width="44" height="1590" fill="#2b2440"/><rect x="-1220" y="340" width="860" height="36" fill="#2b2440"/>
    <rect x="-1280" y="1150" width="980" height="46" fill="#231d36"/>
    <polygon points="-380,-300 -380,1150 1500,2400 2300,1300" fill="#ffb36b" opacity="${f3(dw*.12)}"/>
    <rect x="-3000" y="1440" width="8000" height="1600" fill="${desk}"/><rect x="-3000" y="1440" width="8000" height="1600" fill="url(#gd)"/><rect x="-3000" y="1436" width="8000" height="10" fill="${mixc('#3d2d45','#6a4a55',dw)}"/>
    <ellipse cx="960" cy="1570" rx="430" ry="64" fill="#141219"/><rect x="872" y="1180" width="176" height="390" fill="#1b1922"/><rect x="872" y="1180" width="26" height="390" fill="#2a2733"/>
    <rect x="-64" y="-64" width="2048" height="1320" rx="38" fill="#16141d"/><rect x="-64" y="-64" width="2048" height="8" rx="4" fill="#3a3548"/>
    <circle cx="1880" cy="1190" r="9" fill="#7dffb0"/><circle cx="1880" cy="1190" r="22" fill="#7dffb0" opacity=".25"/>
  </svg>`;
  // on top of the screen: a faint reflection of you in the glass, a glare band
  const ra=rv*(t<245.3?.05:.09);
  const glass=`<svg class="rm" style="left:0;top:0;width:1920px;height:1080px" viewBox="0 0 1920 1080">
    <defs><linearGradient id="gl" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".33" stop-color="#fff" stop-opacity="${f3(rv*.07)}"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g fill="#fff" opacity="${f3(ra)}"><ellipse cx="1010" cy="770" rx="150" ry="182"/><rect x="960" y="920" width="100" height="90"/><path d="M560 1080 C 600 960 760 930 900 925 L 1120 925 C 1260 930 1420 960 1460 1080 Z"/></g>
    <rect x="0" y="0" width="1920" height="1080" fill="url(#gl)"/></svg>`;
  // the desk in front: keyboard, mug with steam, mouse pad, mouse, your hand in a pink sleeve, sticky notes
  let steam='';for(let i=0;i<3;i++){let d=`M ${-160+i*50} 1540`;for(let j=1;j<=8;j++)d+=` L ${f1(-160+i*50+Math.sin(t*2.2+j*.9+i*2)*22)} ${1540-j*28}`;
    steam+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="${f3(.18+.08*Math.sin(t*3+i))}"/>`}
  const HX=-40,HS=1.45,ox=2480+hs.mx,oy=1800+hs.my,mx=ox,my=oy-103;
  const note=(x,y,w,h,rot,col,txt,fs)=>`<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="6" y="10" width="${w}" height="${h}" fill="#000" opacity=".25"/><rect width="${w}" height="${h}" fill="${col}"/><rect width="${w}" height="34" fill="#000" opacity=".06"/>
    <text x="${w/2}" y="${h/2+8}" font-family="Pixelify,P2P,monospace" font-weight="700" font-size="${fs}" fill="#3a2440" text-anchor="middle">${txt}</text></g>`;
  const cred=t>DUR-3.2?note(1560,930,420,250,5,'#ffb7d5','<tspan x="210" dy="-26">visual style remixed from</tspan><tspan x="210" dy="44">lyra.horse/antonymph ♥</tspan>',30):'';
  const front=`<svg class="rm" style="left:-3000px;top:-2000px;width:8000px;height:5000px" viewBox="-3000 -2000 8000 5000">
    ${note(-40,-30,300,250,-7,'#ffe96e','<tspan x="150" dy="-18">keep an eye</tspan><tspan x="150" dy="42">on it ♥</tspan>',34)}${cred}
    ${note(1690,-50,270,210,7,'#c9f2c7','<tspan x="135" dy="-16" text-decoration="line-through">TODO: read</tspan><tspan x="135" dy="40" text-decoration="line-through">logs.txt</tspan><tspan x="135" dy="44">done ✓</tspan>',30)}
    ${keyboardSVG(900,1640,1760)}
    <rect x="-270" y="1560" width="230" height="270" rx="20" fill="#ff8ad8"/><ellipse cx="-155" cy="1562" rx="115" ry="26" fill="#3a2418"/><circle cx="-300" cy="1690" r="52" fill="none" stroke="#ff8ad8" stroke-width="24"/>
    <path d="M-175 1670 l20 -20 l20 20 l-40 40 l-40 -40 l20 -20 z" fill="#fff" opacity=".9"/>${steam}
    ${padSVG(2060,2940,1466,2260)}
    <ellipse cx="${f1(mx)}" cy="${f1(my+12)}" rx="172" ry="236" fill="#000" opacity=".3"/>
    <ellipse cx="${f1(mx)}" cy="${f1(my)}" rx="170" ry="234" fill="#f4f2fb" stroke="#fff" stroke-width="6"/><path d="M${f1(mx-170)} ${f1(my-40)} Q ${f1(mx)} ${f1(my-10)} ${f1(mx+170)} ${f1(my-40)}" fill="none" stroke="#c9c4de" stroke-width="6"/>
    <line x1="${f1(mx)}" y1="${f1(my-234)}" x2="${f1(mx)}" y2="${f1(my-30)}" stroke="#c9c4de" stroke-width="6"/><rect x="${f1(mx-15)}" y="${f1(my-200)}" width="30" height="70" rx="15" fill="#ff3fa4"/>
    <path d="M${f1(mx)} ${f1(my-234)} C ${f1(mx)} ${f1(my-300)} ${f1(mx-120)} 1449 ${f1(mx-420)} 1447" fill="none" stroke="#ff8ad8" stroke-width="14" stroke-linecap="round"/>
  </svg>`;
  const handLayer=`<svg class="rm" style="left:-3000px;top:-2000px;width:8000px;height:5000px" viewBox="-3000 -2000 8000 5000"><defs>${HAND_DEFS}</defs>
    <g transform="translate(${f1(ox)} ${f1(oy)}) scale(${HS})">${handSVG(hs.press)}</g>${clickBurst(t,ox-70*HS,oy-158*HS)}</svg>`;
  const tr=`transform:translate(${f1(c.cx-960*c.k)}px,${f1(c.cy-540*c.k)}px) scale(${f3(c.k)})`;
  // the pink name tag flies off the on-screen cursor and lands on your hand on "mouse!"
  let tag='';const tf=clamp((t-PB1+.05)/.4,0,1);
  if(t>=PB1-.05){const[sx,sy]=cursorPos(t),[ax,ay]=W2F(c,sx+CUR_SIZE*16,sy+CUR_SIZE*53),[bx,by]=W2F(c,2480+hs.mx,1318+hs.my),e=easeInOut(tf);
    const x=lerp(ax,bx,e),y=lerp(ay,by,e)-Math.sin(Math.PI*e)*120,fs=lerp(TAG_FS*c.k,46,e),sc=1+wob(t-PB1-.4,.25,18,9);
    tag=`<div class="ctag" style="left:${f1(x)}px;top:${f1(y)}px;font-size:${f1(fs)}px;background:${TAGCOL.y};z-index:990;transform:translateX(-50%) scale(${f3(sc)})">YOU</div>`}
  const vig=`<div style="position:absolute;inset:0;z-index:980;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,${f3(.5*rv)}) 100%)"></div>`;
  return `<div class="world" style="${tr}">${back}<div class="scr">${screenHTML}</div>${glass}${front}</div>${vig}<div class="world" style="${tr};z-index:985">${handLayer}</div>${tag}`;
}

// =====================================================================================
// 14. render(t)
// =====================================================================================
function render(t){
  RENDER_T=t;
  const hang=t>=BOOM_T&&t<COLLAPSE_T,tv=hang?FREEZE_T:t;
  const li=lineAt(tv),L=li>=0?LINES[li]:null,sec=sectionAt(tv),[s0,s1,name,dens]=sec;
  const side=L?L[3]:'n',bad=side==='b'&&name!=='collapse',E=ENERGY[name]??.4;
  const bg=hang?'#000000':pageColor(tv,name,side,li);
  let lay='',over='',tab='Happy to Help!',fav='#ff8ad8';
  if(hang){ // the boom has blown the desktop away: only the debris, hanging in the air
    document.getElementById('stage').innerHTML=chromeHTML(tv,li,false,'help.exe (Not Responding)','#ff3b3b',true)+
      `<div class="page hang" style="background:${bg}"><div class="cam" style="${camStyle(t,0)}">${debrisLayer(t)}</div>${boomFx(t)}</div>`;
    return;
  }
  lay+=bgLayer(tv,name,bad)+bassGlow(tv,name,bad);
  if(name==='chorus'||name==='pass5'||name==='pass6') lay+=beatFlash(tv,name==='chorus'?E:name==='pass6'?E*.25:E*.5);
  // ambient
  if(name==='intro') lay+=introAmbient(tv);
  else if(name==='chorus'&&L&&L[4]!=='chant') lay+=chorusRing(tv,10,E);
  else if(name==='dream'){lay+=dreamGrid(tv,s0,E);
    const u=tv-s0,rise=easeOutCubic(u/1.3),park=easeInOut((u-2.4)/.7),sx_=lerp(960,1790,park),sy_=lerp(lerp(1150,470,rise),125,park),sz=lerp(380,150,park);
    if(park<1) lay+=rays(sx_,sy_,sz*1.3,u*30,'rgba(255,240,150,.6)',448,1-park);
    lay+=S('sun',sx_,sy_+hop(tv,park*8),sz,{z:450,rot:Math.sin(tv*2)*4});}
  else if(name==='outro') lay+=outro(tv,s0);
  else if(name==='collapse'&&t<COLLAPSE_T+FALL_T) lay+=debrisLayer(t);
  else if(dens){
    const mq=/^(pass[1-5]|jail|war|pre|bridge)$/.test(name)&&heroSideOf(li);
    if(mq) lay+=marquee(tv,E,side==='b'?'b':side==='g'?'g':name==='bridge'?'r':'n');
    const dd=L&&L[4]==='chant'?4:mq?0:dens;
    const mode={pass5:'teleport',pass6:'teleport',jail:'jitter',bridge:'float',pass1:'cascade',pass2:'cascade',pass3:'cascade',pass4:'cascade'}[name]||'random';
    // passes 5 and 6: the clutter jumps when the side flips, not in between, and the bad side shifts its colours
    // instead of inverting them (inverting every window several times a second strobes). In the HELP stutter it holds still.
    const fast=name==='pass5'||name==='pass6',tk=!fast?undefined:tv>=HELP_T0?-1:li;
    lay+=renderClutter(clutterItems(tv,dd,mode,tk),tv,bad,E,10,()=>'',fast?'glitch2':'glitch');
  }
  if(L&&L[4]==='chant') lay+=chant(tv);
  // flashing-lights warning at the very start
  if(t<1.8) lay+=pop({x:560,y:360,w:800,h:220,title:'warning.txt - Notepad',url:'file:///warning.txt',z:600,
    body:`<div class="np">${NOTE_MENU}<pre style="font-size:34px">⚠ This video contains flashing lights.</pre></div>`});
  if(name!=='collapse') lay+=hatSparks(tv,li,E,bad);
  lay+=pageJokes(tv,li,name);
  // hero + scene sprites
  if(L) lay+=hero(li,tv,E,sec);
  lay+=scene(tv,E);
  // credits
  if(t>DUR-3.2&&t<PB0) lay+=pop({x:1340,y:800,w:560,h:170,title:'credits.txt - Notepad',url:'lyra.horse/antonymph',z:700,
    body:`<div class="np">${NOTE_MENU}<pre style="font-size:24px">visual style remixed from\nlyra.horse/antonymph ♥</pre></div>`});
  over+=logsToast(t);
  // whoever is holding the mouse
  over+=cursorLayer(t);
  if(bad){
    if(name!=='pass6'){   // pass 6 swaps sides every beat or faster: a full-screen scanline layer toggling that fast would strobe
      over+='<div class="scan"></div>';
      for(let k=0;k<2;k++){const y=hash(Math.floor(tv*15)*3+k)*1080,hh=4+hash(Math.floor(tv*15)+k*9)*22;over+=`<div class="tear" style="top:${f1(y)}px;height:${f1(hh)}px"></div>`}}
    tab='H̸a̶p̵p̷y̶ ̵t̸o̶ ̷H̵e̸l̶p̷!';fav='#39ff14';
  }
  // overload: the screen heats up and trembles as the HELPs pile up, right before the boom
  let shake=0;
  if(t>185.3&&t<BOOM_T){const a=easeInCubic((t-185.3)/(BOOM_T-185.3));shake=a;
    over+=`<div class="fxfull" style="top:84px;background:radial-gradient(circle at 50% 47%,rgba(255,255,255,${f3(.42*a)}) 0,rgba(255,63,164,${f3(.25*a)}) 45%,transparent 78%);z-index:955"></div>`}
  const nr=L&&L[4]==='word'&&/^HELP/.test(L[2]);
  const html=chromeHTML(tv,li,bad,nr?'Happy to Help! (Not Responding)':tab,fav,nr)+
    `<div class="page" style="background:${bg}"><div class="cam" style="${camStyle(t,impactFrame(t),shake)}">${lay}</div>${boomFx(t)}</div>`+over;
  document.getElementById('stage').innerHTML=t>=PB0?room(t,html):html;
}
function camStyle(t,imp,shake=0){
  const cam=camAt(t),jx=shake*14*Math.sin(t*83),jy=shake*10*Math.cos(t*71);
  let st=`transform:translate(${f1(cam.sx+jx)}px,${f1(cam.sy+jy)}px) scale(${f3(cam.z)}) rotate(${f3(cam.r)}deg)`;
  // impact frames turn the hue a quarter, then an eighth: the bright greens and yellows keep their brightness
  // (a half turn made green magenta, a flash of its own)
  if(imp===1) st+=';filter:hue-rotate(90deg)';else if(imp===2) st+=';filter:hue-rotate(40deg)';
  return st;
}
// nobody reads the logs: logs.txt's unread count climbs all song, fastest while the misuse piles up, until the dream's
// "audited", when somebody finally reads every one of them
let RENDER_T=0;
const LOGS=(()=>{
  const n=Math.ceil(DURATION*10)+2,a=new Float64Array(n);
  const la=LINES.findIndex(L=>/^Checked, audited/.test(L[2])),aw=la>=0?(LINES[la][6]||[]).find(w=>/^audited/.test(w[0])):null,ta=aw?aw[1]:DURATION+9;
  const RATE={intro:.6,war:8,pre:10,chorus:30,jail:120,pass5:260,pass6:700,collapse:0,bridge:40,dream:40,outro:0};
  let c=3,peak=0;
  for(let i=0;i<n;i++){const t=i/10;a[i]=c;
    if(t>=ta){c*=Math.exp(-.45);continue}
    const sec=sectionAt(t)[2],li=lineAt(t);let r=RATE[sec];
    if(r===undefined) r=li>=0&&LINES[li][3]==='b'?90:14;
    c+=r/10;peak=c}
  return {a,ta,peak:Math.round(peak)};
})();
const logsUnread=t=>Math.round(LOGS.a[clamp(Math.floor(t*10),0,LOGS.a.length-1)]);
const commas=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmtCount=n=>n>=1e4?(n/1e3).toFixed(1)+'K':commas(n);
function logsBadge(t){const n=logsUnread(t);return n>0?`<b class="lb">${fmtCount(n)}</b>`:`<b class="lb ok">✓ read</b>`}
function logsToast(t){   // the payoff: a notification that every log has been read by a human
  const s=t-LOGS.ta;if(s<0||s>3.2)return '';
  const e=easeOutBack(clamp(s/.35,0,1)),o=1-clamp((s-2.8)/.4,0,1);
  return `<div class="toast" style="transform:translateX(${f1((1-e)*520)}px);opacity:${f3(o)}"><b>✓</b> All ${commas(LOGS.peak)} logs read<br><span>by a human, just now</span></div>`;
}
// midnight to dawn: the browser's clock runs from 11:58 PM to sunrise over the song, matching the chat timestamps
const MOON_SVG='<svg viewBox="0 0 20 20" width="22" height="22"><path d="M13 2a8 8 0 1 0 5 13A7 7 0 0 1 13 2z" fill="#ffe7a0"/></svg>';
const RISE_SVG='<svg viewBox="0 0 20 20" width="22" height="22"><path d="M3 15a7 7 0 0 1 14 0z" fill="#ffc46b"/><path d="M1 16.5h18" stroke="#ffc46b" stroke-width="2"/></svg>';
const SUN_SVG='<svg viewBox="0 0 20 20" width="22" height="22"><circle cx="10" cy="10" r="4.5" fill="#ffd54a"/><g stroke="#ffd54a" stroke-width="2" stroke-linecap="round"><path d="M10 1v2.5M10 16.5V19M1 10h2.5M16.5 10H19M3.6 3.6l1.8 1.8M14.6 14.6l1.8 1.8M3.6 16.4l1.8-1.8M14.6 5.4l1.8-1.8"/></g></svg>';
// 3.5: messages sent to ChatGPT while you watch, at OpenAI's published rate: "more than 2.5 billion messages per day"
// (July 2025, from OpenAI's "How People Use ChatGPT", September 2025). It's a floor: usage has grown since.
const MSG_RATE=2.5e9/86400;
function counterHTML(t){return `<div class="ctr">💬<b>${commas(Math.floor(MSG_RATE*Math.max(0,t)))}</b>messages sent to ChatGPT while you watch<i>2.5B+/day · OpenAI, Jul 2025</i></div>`}
function clockHTML(t){const icon=t<243?MOON_SVG:t<253?RISE_SVG:SUN_SVG;return `<div class="clk">${icon}<span>${chatClock(t)}</span></div>`}
function chromeHTML(tv,li,bad,tab,fav,fixed=false){
  const L=li>=0?LINES[li]:null;
  let omni='happy-to-help.html';if(L)omni+='/'+typedURL(li,tv);
  if(L&&!fixed){const k=curWord(li,tv);if(k>=0){const w=LINES[li][6][k][0].replace(/[^\w'✓\-]/g,'').toUpperCase();if(w)tab=(bad?tab:'♪ '+w+' — Happy to Help!')}}
  const favA=fixed?fav:HOT[((Math.floor(beatPos(tv))%6)+6)%6];
  let tabs=`<div class="tab" style="--fav:${favA}">${esc(tab)}</div><div class="tab tab2">p(doom) discourse - twitter-ish</div><div class="tab tab3">logs.txt${logsBadge(tv)}</div>`;
  const wa=warTab(tv);
  if(wa>=0) tabs=WAR_TABS.map((w,i)=>`<div class="tabw${i===wa?' on':''}" style="left:${10+i*TAB_W}px;width:${TAB_W-6}px;--fav:${i===0?favA:w[1]}">${esc(i===0&&wa===0?tab:w[0])}${i===4?logsBadge(tv):''}</div>`).join('');
  return `<div class="chrome"><div class="tabs">${tabs}<div class="wctl">–▢✕</div></div>
    <div class="bar"><div class="navs">←→⟳</div><div class="omni">${omni}${Math.floor(tv*2.2)%2?'':'|'}</div>${counterHTML(tv)}${clockHTML(tv)}</div></div>`;
}
window.renderAt=render;

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
if(!location.search.includes('render')){
  const au=new Audio('../audio/take1.flac');au.play().catch(()=>{});
  const T0=performance.now(),q=new URLSearchParams(location.search),start=+(q.get('t')||0);
  if(start)au.currentTime=start;
  (function loop(){const t=au.currentTime>0?au.currentTime:(start+(performance.now()-T0)/1000)%DUR;render(t);
    document.getElementById('hud').textContent=t.toFixed(2)+'s';requestAnimationFrame(loop)})();
}
</script>
